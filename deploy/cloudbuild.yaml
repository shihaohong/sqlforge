# Builds the gateway image on Cloud Build rather than locally: the nodes are
# amd64 and development happens on arm64 Macs, so a local build would need
# emulation. Submit from the repository root:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
#
# $PROJECT_ID is written inline rather than in a substitution default: Cloud
# Build does not expand built-in variables inside other substitutions.
substitutions:
  # Pass the git sha; SHORT_SHA is only populated for trigger-driven builds.
  _TAG: dev
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/Dockerfile
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/sqlforge/gateway:${_TAG}
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/sqlforge/gateway:latest
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/sqlforge/gateway:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/sqlforge/gateway:${_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/sqlforge/gateway:latest
